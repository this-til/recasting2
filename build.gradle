def sha256Hex(byte[] bytes) {
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
    return digest.collect { String.format('%02x', it) }.join('')
}

def sha256FileHex(File file) {
    def md = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) >= 0) {
            md.update(buffer, 0, read)
        }
    }
    return md.digest().collect { String.format('%02x', it) }.join('')
}

def resizePngToMaxDimension(byte[] sourceBytes, int maxDimension) {
    def sourceImage = javax.imageio.ImageIO.read(new ByteArrayInputStream(sourceBytes))
    if (sourceImage == null) {
        return sourceBytes
    }

    int sourceWidth = sourceImage.getWidth()
    int sourceHeight = sourceImage.getHeight()
    int longestSide = Math.max(sourceWidth, sourceHeight)
    if (longestSide <= maxDimension) {
        return sourceBytes
    }

    double scale = maxDimension / (double) longestSide
    int targetWidth = Math.max(1, Math.round(sourceWidth * scale) as int)
    int targetHeight = Math.max(1, Math.round(sourceHeight * scale) as int)
    def targetImage = new java.awt.image.BufferedImage(targetWidth, targetHeight, java.awt.image.BufferedImage.TYPE_INT_ARGB)
    def graphics = targetImage.createGraphics()
    try {
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        graphics.drawImage(sourceImage, 0, 0, targetWidth, targetHeight, null)
    } finally {
        graphics.dispose()
    }

    def output = new ByteArrayOutputStream()
    javax.imageio.ImageIO.write(targetImage, 'png', output)
    return output.toByteArray()
}

def resolveCompressedPng(byte[] sourceBytes, int maxDimension, File cacheDir) {
    def cacheFile = new File(cacheDir, "${sha256Hex(sourceBytes)}-${maxDimension}.png")
    if (cacheFile.isFile()) {
        return [bytes: cacheFile.bytes, cacheHit: true]
    }

    byte[] resizedBytes = resizePngToMaxDimension(sourceBytes, maxDimension)
    cacheFile.parentFile.mkdirs()
    cacheFile.bytes = resizedBytes
    return [bytes: resizedBytes, cacheHit: false]
}

def writeCompressedJar(File sourceJar, File outputJar, int maxDimension, File cacheDir, File fingerprintFile, def taskLogger) {
    def sourceFingerprint = sha256FileHex(sourceJar)
    outputJar.parentFile.mkdirs()
    cacheDir.mkdirs()

    if (outputJar.isFile() && fingerprintFile.isFile() && fingerprintFile.text.trim() == sourceFingerprint) {
        taskLogger.lifecycle("Skipped ${outputJar.name}: source jar fingerprint unchanged.")
        return
    }

    def compressedCount = 0
    def cacheHitCount = 0
    def cacheMissCount = 0
    def copiedCount = 0
    def zipFile = new java.util.zip.ZipFile(sourceJar)
    def zipOutput = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outputJar)))
    try {
        zipFile.entries().each { entry ->
            def outputEntry = new java.util.zip.ZipEntry(entry.name)
            outputEntry.time = entry.time
            if (entry.directory) {
                zipOutput.putNextEntry(outputEntry)
                zipOutput.closeEntry()
                copiedCount++
                return
            }

            byte[] bytes = zipFile.getInputStream(entry).withCloseable { it.bytes }
            if (entry.name.toLowerCase(Locale.ROOT).endsWith('.png')) {
                int originalLength = bytes.length
                def resolved = resolveCompressedPng(bytes, maxDimension, cacheDir)
                bytes = resolved.bytes as byte[]
                if (resolved.cacheHit) {
                    cacheHitCount++
                } else {
                    cacheMissCount++
                }
                if (bytes.length != originalLength) {
                    compressedCount++
                }
            }

            zipOutput.putNextEntry(outputEntry)
            zipOutput.write(bytes)
            zipOutput.closeEntry()
            copiedCount++
        }
    } finally {
        zipOutput.close()
        zipFile.close()
    }

    fingerprintFile.text = sourceFingerprint
    taskLogger.lifecycle("Created ${outputJar} with ${compressedCount} PNG capped to ${maxDimension}px across ${copiedCount} entries (png cache hit=${cacheHitCount}, miss=${cacheMissCount}).")
}

tasks.register('compressed512Jar') {
    description = 'Builds an additional mod JAR with PNG resources capped to 512 pixels.'
    group = 'build'

    dependsOn 'jar'

    def maxDimension = 512
    def sourceJarProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def outputJarProvider = layout.buildDirectory.file("libs/${base.archivesName.get()}-${modVersionBase}-COMPRESSED${snapshotSuffix}.jar")
    def cacheDirProvider = layout.buildDirectory.dir('compressed512-cache')
    def fingerprintProvider = layout.buildDirectory.file('compressed512-cache/compressed-source-fingerprint.txt')

    inputs.file(sourceJarProvider)
    inputs.property('maxDimension', maxDimension)
    outputs.file(outputJarProvider)
    outputs.cacheIf { true }

    doLast {
        writeCompressedJar(
                sourceJarProvider.get().asFile,
                outputJarProvider.get().asFile,
                maxDimension,
                cacheDirProvider.get().asFile,
                fingerprintProvider.get().asFile,
                logger
        )
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }

    def maxDimension = 512
    def devJarProvider = layout.buildDirectory.file("libs/${base.archivesName.get()}-${modVersionBase}-DEV${snapshotSuffix}.jar")
    def cacheDirProvider = layout.buildDirectory.dir('compressed512-cache')
    def fingerprintProvider = layout.buildDirectory.file('compressed512-cache/dev-source-fingerprint.txt')
    outputs.file(devJarProvider)
    doLast {
        writeCompressedJar(
                archiveFile.get().asFile,
                devJarProvider.get().asFile,
                maxDimension,
                cacheDirProvider.get().asFile,
                fingerprintProvider.get().asFile,
                logger
        )
    }

    finalizedBy 'compressed512Jar'
}

