        runModLibraries fg.deobf("curse.maven:embeddium-908741:5681725")
        // Oculus（Iris Forge 移植，光影加载器）—— 仅客户端
        runModLibraries fg.deobf("curse.maven:oculus-581495:6020952")
    }

    //无锋道
    //implementation fg.deobf("curse.maven:rough_blade-1218145:7411635")

    //implementation fg.deobf("curse.maven:octo_lib-916747:6274623")

    //compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    //compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    // at runtime, use the full JEI jar for Forge
    //runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('syncRunMods', Copy) {
    description = 'Syncs mod dependency JARs into run/mods for dev client launches.'
    group = 'forgegradle runs'

    inputs.property('runCompatSrelic', runCompatSrelic)
    inputs.property('runCompatTruePower', runCompatTruePower)
    inputs.property('runShaders', runShaders)

    from configurations.runModLibraries
    into layout.projectDirectory.dir('run/mods')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    include includeRunModJar
    rename renameRunModJar

    doFirst {
        cleanRunModsDir(layout.projectDirectory.dir('run/mods').asFile)
    }
}

tasks.register('syncRunServerMods', Copy) {
    description = 'Syncs server-safe mod JARs into run-server/mods (no client-only jars).'
    group = 'forgegradle runs'

    inputs.property('runCompatSrelic', runCompatSrelic)
    inputs.property('runCompatTruePower', runCompatTruePower)

    from configurations.runServerModLibraries
    into layout.projectDirectory.dir('run-server/mods')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    include includeRunModJar
    rename renameRunModJar

    doFirst {
        // 始终清掉客户端专用 jar，即使曾被手动放进 run-server/mods
        cleanRunModsDir(layout.projectDirectory.dir('run-server/mods').asFile, serverForbiddenClientModMatchers)
    }
}

tasks.register('syncRunDataMods', Copy) {
    description = 'Syncs server-safe mod JARs into run-data/mods for datagen (slashblade etc.).'
    group = 'forgegradle runs'

    inputs.property('runCompatSrelic', runCompatSrelic)
    inputs.property('runCompatTruePower', runCompatTruePower)

    from configurations.runServerModLibraries
    into layout.projectDirectory.dir('run-data/mods')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    include includeRunModJar
    rename renameRunModJar

    doFirst {
        cleanRunModsDir(layout.projectDirectory.dir('run-data/mods').asFile, serverForbiddenClientModMatchers)
    }
}

// Modrinth CDN 固定版本；仅下载缺失文件，不覆盖本地手改
def runShaderPackDownloads = [
        [
                name: 'ComplementaryReimagined_r5.8.1.zip',
                url : 'https://cdn.modrinth.com/data/HVnmMxH1/versions/yCCduG44/ComplementaryReimagined_r5.8.1.zip',
        ],
        [
                name: 'ComplementaryUnbound_r5.8.1.zip',
                url : 'https://cdn.modrinth.com/data/R6NEzAwj/versions/VMHXIk50/ComplementaryUnbound_r5.8.1.zip',
        ],
        [
                name: 'BSL_v10.1.3.zip',
                url : 'https://cdn.modrinth.com/data/Q1vvjJYV/versions/hIibTfxn/BSL_v10.1.3.zip',
        ],
]

tasks.register('syncRunShaderpacks') {
    description = 'Downloads mainstream shader packs into run/shaderpacks when runShaders is enabled.'
    group = 'forgegradle runs'

    inputs.property('runShaders', runShaders)
    inputs.property('shaderPackNames', runShaderPackDownloads.collect { it.name })
    outputs.dir(layout.projectDirectory.dir('run/shaderpacks'))

    onlyIf { runShaders }

    doLast {
        def shaderpacksDir = layout.projectDirectory.dir('run/shaderpacks').asFile
        shaderpacksDir.mkdirs()
        runShaderPackDownloads.each { pack ->
            def dest = new File(shaderpacksDir, pack.name as String)
            if (dest.isFile() && dest.length() > 0) {
                logger.lifecycle("Shader pack present: ${pack.name}")
                return
            }
            logger.lifecycle("Downloading shader pack: ${pack.name}")
            new URL(pack.url as String).withInputStream { input ->
                dest.withOutputStream { output ->
                    output << input
                }
            }
            logger.lifecycle("Saved ${dest} (${dest.length()} bytes)")
        }
    }
}

afterEvaluate {
    // 客户端：同步 run/mods + 光影包
    tasks.matching { it.name in ['prepareRunClient', 'prepareRunClientCompile'] }.configureEach {
        dependsOn 'syncRunMods', 'syncRunShaderpacks'
    }
    // 专用服 / GameTest：同步 run-server/mods（无客户端 jar）
    tasks.matching { it.name in ['prepareRunServer', 'prepareRunServerCompile', 'prepareRunGameTestServer', 'prepareRunGameTestServerCompile'] }.configureEach {
        dependsOn 'syncRunServerMods'
    }
    // datagen：同步 run-data/mods，满足 mods.toml 对 slashblade 的强制依赖
    tasks.matching { it.name in ['prepareRunData', 'prepareRunDataCompile'] }.configureEach {
        dependsOn 'syncRunDataMods'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

def sha256Hex(byte[] bytes) {
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
    return digest.collect { String.format('%02x', it) }.join('')
}

def sha256FileHex(File file) {
    def md = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) >= 0) {
            md.update(buffer, 0, read)
        }
    }
    return md.digest().collect { String.format('%02x', it) }.join('')
}

def resizePngToMaxDimension(byte[] sourceBytes, int maxDimension) {
    def sourceImage = javax.imageio.ImageIO.read(new ByteArrayInputStream(sourceBytes))
    if (sourceImage == null) {
        return sourceBytes
    }

    int sourceWidth = sourceImage.getWidth()
    int sourceHeight = sourceImage.getHeight()
    int longestSide = Math.max(sourceWidth, sourceHeight)
    if (longestSide <= maxDimension) {
        return sourceBytes
    }

    double scale = maxDimension / (double) longestSide
    int targetWidth = Math.max(1, Math.round(sourceWidth * scale) as int)
    int targetHeight = Math.max(1, Math.round(sourceHeight * scale) as int)
    def targetImage = new java.awt.image.BufferedImage(targetWidth, targetHeight, java.awt.image.BufferedImage.TYPE_INT_ARGB)
    def graphics = targetImage.createGraphics()
    try {
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        graphics.drawImage(sourceImage, 0, 0, targetWidth, targetHeight, null)
    } finally {
        graphics.dispose()
    }

    def output = new ByteArrayOutputStream()
    javax.imageio.ImageIO.write(targetImage, 'png', output)
    return output.toByteArray()
}

/**
 * 按原始 PNG 内容哈希复用已缩放结果；命中时跳过 ImageIO。
 */
def resolveCompressedPng(byte[] sourceBytes, int maxDimension, File cacheDir) {
    def cacheFile = new File(cacheDir, "${sha256Hex(sourceBytes)}-${maxDimension}.png")
    if (cacheFile.isFile()) {
        return [bytes: cacheFile.bytes, cacheHit: true]
    }

    byte[] resizedBytes = resizePngToMaxDimension(sourceBytes, maxDimension)
    cacheFile.parentFile.mkdirs()
    cacheFile.bytes = resizedBytes
    return [bytes: resizedBytes, cacheHit: false]
}

tasks.register('compressed512Jar') {
    description = 'Builds an additional mod JAR with PNG resources capped to 512 pixels.'
    group = 'build'

    dependsOn 'reobfJar'

    def maxDimension = 512
    def sourceJarProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
    // 输出：recasting2-1.20.1-{version}-COMPRESSED[-SNAPSHOT].jar
    def outputJarProvider = layout.buildDirectory.file("libs/${base.archivesName.get()}-${modVersionBase}-COMPRESSED${snapshotSuffix}.jar")
    def cacheDirProvider = layout.buildDirectory.dir('compressed512-cache')
    def fingerprintProvider = layout.buildDirectory.file('compressed512-cache/source-fingerprint.txt')

    inputs.file(sourceJarProvider)
    inputs.property('maxDimension', maxDimension)
    outputs.file(outputJarProvider)
    outputs.cacheIf { true }

    doLast {
        def sourceJar = sourceJarProvider.get().asFile
        def outputJar = outputJarProvider.get().asFile
        def cacheDir = cacheDirProvider.get().asFile
        def fingerprintFile = fingerprintProvider.get().asFile
        def sourceFingerprint = sha256FileHex(sourceJar)
        outputJar.parentFile.mkdirs()
        cacheDir.mkdirs()

        // 源 jar 内容哈希未变且产物仍在：整包跳过
        if (outputJar.isFile() && fingerprintFile.isFile() && fingerprintFile.text.trim() == sourceFingerprint) {
            logger.lifecycle("Skipped ${outputJar.name}: source jar fingerprint unchanged.")
            return
        }

        def compressedCount = 0
        def cacheHitCount = 0
        def cacheMissCount = 0
        def copiedCount = 0
        def zipFile = new java.util.zip.ZipFile(sourceJar)
        def zipOutput = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outputJar)))
        try {
            zipFile.entries().each { entry ->
                def outputEntry = new java.util.zip.ZipEntry(entry.name)
                outputEntry.time = entry.time
                if (entry.directory) {
                    zipOutput.putNextEntry(outputEntry)
                    zipOutput.closeEntry()
                    copiedCount++
                    return
                }

                byte[] bytes = zipFile.getInputStream(entry).withCloseable { it.bytes }
                if (entry.name.toLowerCase(Locale.ROOT).endsWith('.png')) {
                    int originalLength = bytes.length
                    def resolved = resolveCompressedPng(bytes, maxDimension, cacheDir)
                    bytes = resolved.bytes as byte[]
                    if (resolved.cacheHit) {
                        cacheHitCount++
                    } else {
                        cacheMissCount++
                    }
                    if (bytes.length != originalLength) {
                        compressedCount++
                    }
                }

                zipOutput.putNextEntry(outputEntry)
                zipOutput.write(bytes)
                zipOutput.closeEntry()
                copiedCount++
            }
        } finally {
            zipOutput.close()
            zipFile.close()
        }

        fingerprintFile.text = sourceFingerprint
        logger.lifecycle("Created ${outputJar} with ${compressedCount} PNG capped to ${maxDimension}px across ${copiedCount} entries (png cache hit=${cacheHitCount}, miss=${cacheMissCount}).")
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
    finalizedBy 'compressed512Jar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
