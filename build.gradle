    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'

    // SlashBlade Resharped 2.0.5 (NeoForge 1.21.1)
    // 编译用 compileOnly；运行时走 run*/mods，避免双加载
    compileOnly "curse.maven:SlashBlade_Resharped-1022428:8667925"
    testCompileOnly "curse.maven:SlashBlade_Resharped-1022428:8667925"
    runServerModLibraries "curse.maven:SlashBlade_Resharped-1022428:8667925"

    // Curios（历史前置；1.21.1 NeoForge 9.5.1）
    compileOnly "curse.maven:curios-309927:6529130"
    testCompileOnly "curse.maven:curios-309927:6529130"
    runServerModLibraries "curse.maven:curios-309927:6529130"

    // 假人前置 Moonlight / Selene
    runServerModLibraries "curse.maven:selene-499980:8717661"
    // 训练假人
    runServerModLibraries "curse.maven:mmmmmmmmmmmm-225738:8510632"

    // JEI
    compileOnly "curse.maven:jei-238222:8678372"
    runServerModLibraries "curse.maven:jei-238222:8678372"

    // 开发辅助
    // IBE Editor：暂无 1.21 NeoForge 构建 —— 已跳过
    // slashblade-model-warmup：暂无 1.21 NeoForge 构建 —— 已跳过
    runServerModLibraries "curse.maven:damage-number-998849:6982481"

    if (runCompatSrelic) {
        // GameRelic / srelic：暂无 1.21 NeoForge —— 仅保留可用前置，便于后续接回
        // runServerModLibraries "curse.maven:slashblade-gamerelic-1143914:????"
        runServerModLibraries "curse.maven:legendreliclib-1307366:8079188"
        runServerModLibraries "curse.maven:patchouli-306770:7730942"
    }

    if (runCompatTruePower) {
        runServerModLibraries "curse.maven:true-power-dmc5-sfx-1609911:8457284"
        runServerModLibraries "curse.maven:true-power-1287990:8697337"
        runServerModLibraries "curse.maven:mrqx-s-slashblade-core-1235855:8705321"
        runServerModLibraries "curse.maven:playeranimator-658587:7389814"
    }

    if (runShaders) {
        // Sodium 0.8（Iris NeoForge 与 Embeddium 互斥）—— 仅客户端
        runModLibraries "maven.modrinth:sodium:mc1.21.1-0.8.12-neoforge"
        // Iris 替代 Oculus（1.21 NeoForge 无 Oculus）—— 仅客户端
        runModLibraries "maven.modrinth:iris:1.8.14-beta.1+1.21.1-neoforge"
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('compileGeneratedJava') {
    dependsOn tasks.named('classes')
}

tasks.register('syncRunMods', Copy) {
    description = 'Syncs mod dependency JARs into run/mods for dev client launches.'
    group = 'neoforge runs'

    inputs.property('runCompatSrelic', runCompatSrelic)
    inputs.property('runCompatTruePower', runCompatTruePower)
    inputs.property('runShaders', runShaders)

    from configurations.runModLibraries
    into layout.projectDirectory.dir('run/mods')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    include includeRunModJar
    rename renameRunModJar

    doFirst {
        cleanRunModsDir(layout.projectDirectory.dir('run/mods').asFile)
    }
}

tasks.register('syncRunServerMods', Copy) {
    description = 'Syncs server-safe mod JARs into run-server/mods (no client-only jars).'
    group = 'neoforge runs'

    inputs.property('runCompatSrelic', runCompatSrelic)
    inputs.property('runCompatTruePower', runCompatTruePower)

    from configurations.runServerModLibraries
    into layout.projectDirectory.dir('run-server/mods')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    include includeRunModJar
    rename renameRunModJar

    doFirst {
        cleanRunModsDir(layout.projectDirectory.dir('run-server/mods').asFile, serverForbiddenClientModMatchers)
    }
}

tasks.register('syncRunDataMods', Copy) {
    description = 'Syncs server-safe mod JARs into run-data/mods for datagen.'
    group = 'neoforge runs'

    inputs.property('runCompatSrelic', runCompatSrelic)
    inputs.property('runCompatTruePower', runCompatTruePower)

    from configurations.runServerModLibraries
    into layout.projectDirectory.dir('run-data/mods')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    include includeRunModJar
    rename renameRunModJar

    doFirst {
        cleanRunModsDir(layout.projectDirectory.dir('run-data/mods').asFile, serverForbiddenClientModMatchers)
    }
}

