tasks.register('syncRunShaderpacks') {
    description = 'Downloads mainstream shader packs into run/shaderpacks when runShaders is enabled.'
    group = 'neoforge runs'

    inputs.property('runShaders', runShaders)
    inputs.property('shaderPackNames', runShaderPackDownloads.collect { it.name })
    outputs.dir(layout.projectDirectory.dir('run/shaderpacks'))

    onlyIf { runShaders }

    doLast {
        def shaderpacksDir = layout.projectDirectory.dir('run/shaderpacks').asFile
        shaderpacksDir.mkdirs()
        runShaderPackDownloads.each { pack ->
            def dest = new File(shaderpacksDir, pack.name as String)
            if (dest.isFile() && dest.length() > 0) {
                logger.lifecycle("Shader pack present: ${pack.name}")
                return
            }
            logger.lifecycle("Downloading shader pack: ${pack.name}")
            new URI(pack.url as String).toURL().withInputStream { input ->
                dest.withOutputStream { output ->
                    output << input
                }
            }
            logger.lifecycle("Saved ${dest} (${dest.length()} bytes)")
        }
    }
}

afterEvaluate {
    tasks.named('runClient').configure {
        dependsOn 'syncRunMods', 'syncRunShaderpacks'
    }
    tasks.named('runServer').configure {
        dependsOn 'syncRunServerMods'
    }
    tasks.named('runGameTestServer').configure {
        dependsOn 'syncRunServerMods'
    }
    tasks.named('runData').configure {
        dependsOn 'syncRunDataMods', 'generatedClasses'
    }
}

