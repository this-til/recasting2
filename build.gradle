plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def modVersionBase = mod_version.replaceFirst(/-SNAPSHOT$/, '')
def snapshotSuffix = mod_version.endsWith('-SNAPSHOT') ? '-SNAPSHOT' : ''

base {
    // 输出：
    //   recasting2-1.21.1-{version}[-SNAPSHOT].jar            （发布用）
    //   recasting2-1.21.1-{version}-COMPRESSED[-SNAPSHOT].jar （PNG≤512）
    //   recasting2-1.21.1-{version}-DEV[-SNAPSHOT].jar          （PNG≤512，开发者用）
    archivesName = "recasting2-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

// Data generator sources depend on the main source set and are compiled only for runData.
sourceSets {
    generated {
        java.srcDir 'src/generated/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        annotationProcessorPath = sourceSets.main.annotationProcessorPath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // 与客户端 run/ 隔离，避免 iris/sodium 等客户端 jar 进入专用服
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.generated)
        }
    }
}

repositories {
    maven {
        name = 'MMMaven'
        url = 'https://raw.github.com/0999312/MMMaven/main/repository'
    }
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        // Iris (Oculus 在 1.21 NeoForge 无对应包时的光影加载器)
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        // Registrate / Moonlight peers if needed
        url = 'https://maven.tterrag.com/'
    }
    mavenLocal()
}

configurations {
    // 与 1.20 一致：依赖不进 implementation/localRuntime，避免与 run*/mods 双加载
    // 专用服 / datagen：双方都需要的运行时依赖
    runServerModLibraries {
        canBeConsumed = false
        canBeResolved = true
    }
    // 客户端：继承服务端集合，再叠加客户端专用 jar
    runModLibraries {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom runServerModLibraries
    }
}

/**
 * Gradle 运行参数开关：存在属性且值非 false/0 时开启。
 * 例：./gradlew runClient -PrunCompatSrelic -PrunCompatTruePower -PrunShaders
 * 或 gradle.properties：runCompatSrelic=true / runShaders=true
 */
def parseRunFlag(String name) {
    if (!project.hasProperty(name)) {
        return false
    }
    def value = project.property(name)?.toString()?.trim()
    if (value == null || value.isEmpty()) {
        return true
    }
    return value.equalsIgnoreCase('true') || value == '1'
}

// SlashBlade 扩展兼容 mod：默认不注入
def runCompatSrelic = parseRunFlag('runCompatSrelic')
def runCompatTruePower = parseRunFlag('runCompatTruePower')
// Sodium + Iris + 主流光影包：仅客户端；默认开启；关闭 -PrunShaders=false
def runShaders = project.hasProperty('runShaders') ? parseRunFlag('runShaders') : true

/** 仅同步带 mods 元数据的依赖 jar，排除 neoforge/minecraft 本体。 */
def includeRunModJar = { FileTreeElement details ->
    if (!details.file.name.endsWith('.jar')) {
        return false
    }
    def name = details.file.name.toLowerCase()
    if (name.startsWith('neoforge-') || name.startsWith('forge-') || name.startsWith('minecraft-')) {
        return false
    }
    def jarFile = new java.util.zip.ZipFile(details.file)
    try {
        return jarFile.getEntry('META-INF/neoforge.mods.toml') != null || jarFile.getEntry('META-INF/mods.toml') != null
    } finally {
        jarFile.close()
    }
}

/** SecureJar 自动模块名：true-power → truepower */
def renameRunModJar = { String fileName ->
    fileName.replace('true-power', 'truepower')
}

/**
 * 按开关清理 mods 目录中不应保留的 jar。
 * @param alwaysRemove 始终删除的文件名谓词（如服务端排除客户端 jar）
 */
def cleanRunModsDir = { File modsDir, List alwaysRemove = [] ->
    if (!modsDir.isDirectory()) {
        return
    }
    def removeNameMatchers = [] as List
    removeNameMatchers.addAll(alwaysRemove)
    if (!runCompatSrelic) {
        removeNameMatchers.addAll([
                { String n -> n.startsWith('slashblade-gamerelic') || n.startsWith('srelic') },
                { String n -> n.startsWith('legendreliclib') },
                { String n -> n.startsWith('patchouli') },
        ])
    }
    if (!runCompatTruePower) {
        removeNameMatchers.addAll([
                { String n -> n.startsWith('true-power') || n.startsWith('truepower') || n.startsWith('true_power') },
                { String n -> n.startsWith('mrqx') },
                { String n -> n.startsWith('playeranimator') || n.startsWith('player_animator') || n.startsWith('player-animation') },
        ])
    }
    if (!runShaders) {
        removeNameMatchers.addAll([
                { String n -> n.startsWith('sodium') || n.startsWith('embeddium') },
                { String n -> n.startsWith('oculus') || n.startsWith('iris') },
        ])
    } else {
        // Iris NeoForge 与 Embeddium 互斥，清理历史残留
        removeNameMatchers.add({ String n -> n.startsWith('embeddium') })
    }
    modsDir.listFiles()?.each { File file ->
        if (!file.name.toLowerCase(Locale.ROOT).endsWith('.jar')) {
            return
        }
        def lowerName = file.name.toLowerCase(Locale.ROOT)
        if (removeNameMatchers.any { it.call(lowerName) }) {
            logger.lifecycle("Removing duplicate/disabled run mod: ${file.name}")
            file.delete()
        }
    }
}

// 服务端 mods 目录禁止出现的客户端专用 jar 前缀（渲染/光影类）
def serverForbiddenClientModMatchers = [
        { String n -> n.startsWith('sodium') || n.startsWith('embeddium') },
        { String n -> n.startsWith('oculus') || n.startsWith('iris') },
]

