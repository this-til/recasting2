        // True POWER（拔刀战斗系统大改）
        runServerModLibraries fg.deobf("curse.maven:true-power-1287990:8456203")
        // mrqx's Slashblade Core（True POWER 前置库）
        runServerModLibraries fg.deobf("curse.maven:mrqx-s-slashblade-core-1235855:8018780")
        // playerAnimator（玩家动画库，True POWER 依赖）
        runServerModLibraries fg.deobf("curse.maven:playeranimator-658587:4587214")
    }

    if (runShaders) {
